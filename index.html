
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Image Showcase</title>
	<style>
		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			background: #f3f4f6;
			font-family: Arial, sans-serif;
		}

		img {
			display: block;
			width: min(90vw, 800px);
			height: auto;
			border-radius: 12px;
			box-shadow: 0 8px 24px rgb(0 0 0 / 15%);
		}
	</style>
</head>
<body>
	<main>
		<img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1200&q=80" alt="Mountain landscape beneath a blue sky">
	</main>
</body>
</html>
